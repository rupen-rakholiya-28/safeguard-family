services:
  - type: web
    name: safeguard-family-api
    repo: https://github.com/rupen-rakholiya-28/safeguard-family.git
    branch: main
    buildCommand: chmod +x backend/build.sh && bash backend/build.sh
    startCommand: java -jar backend/target/*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod